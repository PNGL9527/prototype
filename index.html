<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#171a1f" />
  <title>Campus Laundry</title>
  <style>
    :root {
      --bg: #171a1f;
      --panel: #232830;
      --panel-2: #2c323c;
      --panel-3: #343c48;
      --line: rgba(255,255,255,.10);
      --text: #f5f7fb;
      --muted: #a7afbb;
      --green: #40dc89;
      --green-deep: #15945a;
      --amber: #f5a623;
      --amber-2: #ee8426;
      --red: #e9533f;
      --red-2: #bd443f;
      --blue: #55a9ff;
      --shadow: 0 14px 30px rgba(0,0,0,.28);
      --small-shadow: 0 7px 16px rgba(0,0,0,.22);
      --radius: 22px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background: #111317;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: .01em;
      overflow-x: hidden;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    button, input { font: inherit; }
    button { color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid rgba(85,169,255,.95); outline-offset: 3px; }

    .device {
      width: min(1180px, calc(100vw - 24px));
      aspect-ratio: 4 / 3;
      min-height: 0;
      max-height: calc(100dvh - 24px);
      margin: 0 auto;
      background:
        radial-gradient(circle at 80% -10%, rgba(81,112,150,.16), transparent 34%),
        linear-gradient(140deg, #1a1d22 0%, #171a1f 62%, #131519 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 0 80px rgba(0,0,0,.42);
      position: relative;
      overflow: auto;
      border-radius: 26px;
    }

    .topbar {
      height: 86px;
      padding: 20px clamp(20px, 4vw, 54px) 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(19,22,27,.74);
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 2;
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 13px;
      display: grid; place-items: center;
      background: linear-gradient(140deg, #32d985, #178e63);
      box-shadow: 0 7px 18px rgba(28,190,111,.22), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .brand-mark svg { width: 25px; height: 25px; }
    .brand-copy strong { display: block; font-size: 17px; line-height: 1.1; letter-spacing: .01em; }
    .brand-copy span { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }

    .top-status { display: flex; align-items: center; gap: 9px; color: #c6ced8; font-size: 13px; white-space: nowrap; }
    .online-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--green); box-shadow: 0 0 0 4px rgba(64,220,137,.11), 0 0 12px rgba(64,220,137,.65); }

    main { padding: clamp(26px, 5vw, 54px) clamp(20px, 5vw, 62px) 54px; }
    .view { animation: viewIn .32s ease-out both; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .hero { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 28px; }
    .eyebrow { color: #72b6ff; font-size: 12px; text-transform: uppercase; font-weight: 800; letter-spacing: .16em; margin-bottom: 10px; }
    h1 { margin: 0; font-size: clamp(27px, 4vw, 40px); line-height: 1.07; letter-spacing: -.035em; }
    .subhead { margin: 10px 0 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .legend { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 9px 16px; color: #bec5cf; font-size: 12px; padding-bottom: 3px; }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 9px currentColor; }

    .machine-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }
    .machine-card {
      min-height: 190px;
      text-align: left;
      padding: 21px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(48,56,68,.96), rgba(34,40,49,.97));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
      position: relative;
      overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .machine-card:active { transform: scale(.985); }
    .machine-card.available:hover { transform: translateY(-3px); border-color: rgba(64,220,137,.55); box-shadow: 0 16px 30px rgba(0,0,0,.3), 0 0 0 1px rgba(64,220,137,.1), inset 0 1px 0 rgba(255,255,255,.06); }
    .machine-card::after { content: ""; position: absolute; width: 120px; height: 120px; top: -60px; right: -36px; border-radius: 50%; background: rgba(255,255,255,.035); pointer-events: none; }
    .machine-top, .machine-bottom { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
    .machine-label { color: #adb6c3; font-size: 12px; text-transform: uppercase; letter-spacing: .13em; font-weight: 800; }
    .machine-number { font-size: 30px; font-weight: 800; letter-spacing: -.04em; margin-top: 5px; }
    .machine-status { display: flex; gap: 11px; align-items: center; margin-top: 31px; position: relative; z-index: 1; }
    .status-icon { width: 33px; height: 33px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; }
    .status-icon svg { width: 19px; height: 19px; }
    .status-name { font-size: 16px; font-weight: 750; }
    .status-detail { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .status-badge { border-radius: 99px; padding: 6px 9px; font-size: 11px; font-weight: 800; letter-spacing: .04em; }
    .available .status-icon, .available .status-badge { color: var(--green); background: rgba(64,220,137,.13); }
    .in-use .status-icon, .in-use .status-badge { color: var(--red); background: rgba(233,83,63,.14); }
    .finishing .status-icon, .finishing .status-badge { color: var(--amber); background: rgba(245,166,35,.14); }
    .machine-card.in-use, .machine-card.finishing { cursor: pointer; }
    .machine-bottom { margin-top: 24px; color: #bdc5d0; font-size: 12px; }
    .machine-bottom svg { width: 16px; height: 16px; vertical-align: -4px; margin-right: 4px; }

    .setup-wrap { max-width: 920px; margin: 0 auto; }
    .back-button { display: inline-flex; align-items: center; gap: 8px; color: #bdc9d6; background: transparent; font-size: 14px; font-weight: 700; padding: 10px 3px; margin: -8px 0 25px; }
    .back-button svg { width: 18px; height: 18px; }
    .setup-heading { display: flex; align-items: start; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .selected-machine { display: flex; align-items: center; gap: 14px; }
    .selected-machine .machine-symbol { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 17px; background: rgba(64,220,137,.13); color: var(--green); }
    .selected-machine .machine-symbol svg { width: 30px; height: 30px; }
    .setup-heading h1 { font-size: clamp(26px, 4vw, 36px); }
    .availability-pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(64,220,137,.24); background: rgba(64,220,137,.09); color: var(--green); padding: 9px 12px; border-radius: 99px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .availability-pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
    .control-section { border-top: 1px solid var(--line); padding-top: 22px; margin-top: 24px; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; margin-bottom: 14px; }
    .section-heading h2 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .program-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .option-card { min-height: 108px; text-align: left; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(42,49,59,.84); transition: .16s ease; }
    .option-card.selected { border-color: rgba(85,169,255,.96); background: linear-gradient(145deg, rgba(48,103,157,.42), rgba(37,62,89,.66)); box-shadow: 0 0 0 2px rgba(85,169,255,.17), inset 0 1px 0 rgba(255,255,255,.08); }
    .option-card:active, .temp-option:active { transform: scale(.98); }
    .option-title { font-size: 15px; font-weight: 800; display: block; }
    .option-note { font-size: 12px; color: var(--muted); display: block; margin-top: 6px; line-height: 1.35; }
    .option-time { color: #79baff; font-size: 12px; display: block; margin-top: 10px; font-weight: 700; }
    .temp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .temp-option { min-height: 94px; text-align: left; display: flex; align-items: center; gap: 11px; border-radius: 16px; border: 1px solid var(--line); padding: 13px; background: rgba(42,49,59,.84); transition: .16s ease; }
    .temp-option.selected { border-color: rgba(85,169,255,.96); background: linear-gradient(145deg, rgba(48,103,157,.42), rgba(37,62,89,.66)); box-shadow: 0 0 0 2px rgba(85,169,255,.17); }
    .temp-icon { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.07); }
    .temp-icon svg { width: 21px; height: 21px; }
    .temp-cold { color: #70bcff; } .temp-warm { color: #ffbd3d; } .temp-hot { color: #ff6a54; }
    .temp-option strong { display: block; font-size: 14px; } .temp-option small { display: block; color: var(--muted); font-size: 11px; margin-top: 5px; }
    .duration-panel { padding: 18px; border-radius: 18px; background: rgba(42,49,59,.76); border: 1px solid var(--line); }
    .duration-readout { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 2px 0 18px; }
    .duration-readout strong { font-variant-numeric: tabular-nums; font-size: 40px; letter-spacing: -.05em; }
    .duration-readout span { color: var(--muted); font-size: 13px; }
    .duration-controls { display: flex; align-items: center; gap: 15px; }
    .stepper { width: 52px; height: 52px; border-radius: 16px; background: var(--panel-3); color: #e9edf4; font-size: 27px; line-height: 1; box-shadow: var(--small-shadow); }
    .stepper:active { transform: scale(.94); }
    .range-wrap { flex: 1; }
    input[type="range"] { appearance: none; width: 100%; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #4aa8ff 0%, #4aa8ff 35%, #47515e 35%, #47515e 100%); outline: none; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; width: 26px; height: 26px; border: 3px solid #e8f4ff; border-radius: 50%; background: #4daaff; box-shadow: 0 2px 10px rgba(70,166,255,.48); }
    input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border: 3px solid #e8f4ff; border-radius: 50%; background: #4daaff; }
    .range-labels { display: flex; justify-content: space-between; color: #858f9d; font-size: 11px; margin-top: 10px; }
    .start-button { width: 100%; min-height: 62px; margin-top: 27px; border-radius: 18px; background: linear-gradient(135deg, #36d881, #19a96c); color: #071b12; font-size: 18px; font-weight: 900; letter-spacing: .01em; box-shadow: 0 9px 23px rgba(24,183,111,.24), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .16s ease, filter .16s ease; }
    .start-button:active { transform: scale(.985); filter: brightness(.94); }
    .start-button svg { width: 20px; height: 20px; vertical-align: -5px; margin-right: 8px; }

    .confirm-wrap { max-width: 700px; margin: 0 auto; text-align: center; }
    .confirm-wrap .back-button { display: flex; width: fit-content; margin-bottom: 28px; }
    .cycle-chip { display: inline-flex; align-items: center; gap: 8px; color: #77eaaa; background: rgba(64,220,137,.10); border: 1px solid rgba(64,220,137,.18); border-radius: 99px; padding: 8px 12px; font-size: 12px; font-weight: 800; }
    .cycle-chip svg { width: 16px; height: 16px; }
    .confirm-wrap h1 { margin-top: 18px; }
    .confirm-sub { color: var(--muted); margin: 11px auto 31px; font-size: 15px; }
    .timer-shell { width: min(66vw, 310px); aspect-ratio: 1; margin: 0 auto 30px; position: relative; display: grid; place-items: center; }
    .timer-shell::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(#42dc8b var(--progress), rgba(255,255,255,.09) 0); box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 23px 44px rgba(0,0,0,.34); }
    .timer-shell::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #1e242c; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
    .timer-inner { position: relative; z-index: 1; }
    .timer-inner strong { display: block; font-variant-numeric: tabular-nums; font-size: clamp(40px, 9vw, 62px); letter-spacing: -.065em; }
    .timer-inner span { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .15em; }
    .finish-note { display: inline-flex; gap: 8px; align-items: center; color: #d2dae5; font-size: 13px; }
    .finish-note svg { color: var(--green); width: 17px; height: 17px; }
    .done-button { display: block; min-width: 190px; margin: 30px auto 0; padding: 14px 20px; border-radius: 15px; background: var(--panel-3); color: #dce4ed; font-weight: 800; }
    .done-button:active { transform: scale(.98); }

    .toast { position: fixed; z-index: 20; left: 50%; bottom: 28px; transform: translate(-50%, 20px); min-width: min(340px, calc(100vw - 32px)); padding: 14px 17px; border-radius: 15px; display: flex; align-items: center; gap: 11px; background: rgba(29,34,42,.96); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 13px 36px rgba(0,0,0,.42); color: #f4f7fb; opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease; font-size: 14px; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .toast-icon { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; color: var(--amber); background: rgba(245,166,35,.14); flex: 0 0 auto; }
    .toast-icon svg { width: 15px; height: 15px; }

    @media (max-width: 720px) {
      body { display: block; padding: 0; }
      .device { width: 100%; min-height: 100vh; aspect-ratio: auto; max-height: none; border-radius: 0; }
      .topbar { height: 74px; padding: 15px 20px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 11px; }
      .brand-copy strong { font-size: 15px; }
      .brand-copy span { font-size: 11px; }
      .top-status { font-size: 11px; }
      main { padding-top: 27px; }
      .hero { display: block; }
      .legend { justify-content: flex-start; margin-top: 20px; }
      .machine-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .machine-card { min-height: 174px; padding: 16px; border-radius: 18px; }
      .machine-number { font-size: 26px; }
      .machine-status { margin-top: 25px; gap: 8px; }
      .status-icon { width: 29px; height: 29px; border-radius: 10px; }
      .status-icon svg { width: 16px; height: 16px; }
      .status-name { font-size: 14px; }
      .status-detail { font-size: 11px; }
      .machine-bottom { margin-top: 19px; font-size: 11px; }
      .setup-heading { display: block; }
      .availability-pill { margin-top: 17px; }
    }

    @media (max-width: 430px) {
      .top-status span { display: none; }
      .program-grid, .temp-grid { gap: 8px; }
      .option-card { min-height: 116px; padding: 13px 11px; }
      .option-title { font-size: 13px; }
      .option-note { font-size: 11px; }
      .temp-option { padding: 10px 8px; gap: 7px; }
      .temp-icon { width: 31px; height: 31px; border-radius: 10px; }
      .temp-icon svg { width: 18px; height: 18px; }
      .temp-option strong { font-size: 12px; }
      .temp-option small { font-size: 10px; }
    }

    @media (min-width: 900px) { .machine-card { min-height: 208px; } }
  </style>
</head>
<body>
  <div class="device" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="11" stroke="white" stroke-width="2.4" opacity=".95"/><circle cx="16" cy="16" r="5" fill="white" opacity=".93"/><path d="M7.8 9.4c2.2-2.6 5-4 8.2-4 3.1 0 5.9 1.4 8.1 4" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity=".55"/></svg>
        </div>
        <div class="brand-copy"><strong>Campus Laundry</strong><span>Residence Hall · Level 1</span></div>
      </div>
      <div class="top-status"><i class="online-dot"></i><span>System online</span></div>
    </header>
    <main id="main"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <div class="toast-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/></svg></div>
    <span>This machine is currently in use</span>
  </div>

  <script>
    const icons = {
      check: '<svg viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.2 4.1L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      spin: '<svg viewBox="0 0 24 24" fill="none"><path d="M18.7 8.5A7.5 7.5 0 1 0 19.4 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 4.5v4.8h-4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      soon: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
      back: '<svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5m6-6-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.4v13.2c0 1 1.1 1.6 2 1l9.5-6.6a1.2 1.2 0 0 0 0-2L10 4.4c-.9-.6-2 .1-2 1Z"/></svg>',
      drum: '<svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="17" r="10.5" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="17" r="5" stroke="currentColor" stroke-width="1.8" opacity=".8"/><path d="M8 8.5c2.2-2.3 4.9-3.5 8-3.5 3.2 0 5.9 1.2 8 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".8"/></svg>',
      wave: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 9c2.7-2.2 5.3-2.2 8 0s5.3 2.2 8 0M4 14c2.7-2.2 5.3-2.2 8 0s5.3 2.2 8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
      snow: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M8 5.3 12 3l4 2.3M8 18.7l4 2.3 4-2.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      flame: '<svg viewBox="0 0 24 24" fill="none"><path d="M12.4 21c4.1 0 6.8-2.5 6.8-6.4 0-3.5-2.4-5.6-4.5-7.8-.3 2.1-1.2 3.1-2.1 3.7.2-3.7-1.5-6.1-3.8-7.8.2 3.3-3.8 5.6-3.8 10.2C5 17.9 8 21 12.4 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
      drop: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3s6 6.2 6 11a6 6 0 0 1-12 0c0-4.8 6-11 6-11Z" stroke="currentColor" stroke-width="1.9"/></svg>'
    };

    const machines = [
      { id: 1, state: 'available', status: 'Available', detail: 'Ready for a new cycle', room: 'North wall' },
      { id: 2, state: 'in-use', status: 'In use', detail: '22:15 remaining', room: 'North wall', time: '22:15' },
      { id: 3, state: 'finishing', status: 'Finishing soon', detail: '4:32 remaining', room: 'North wall', time: '4:32' },
      { id: 4, state: 'available', status: 'Available', detail: 'Ready for a new cycle', room: 'South wall' },
      { id: 5, state: 'in-use', status: 'In use', detail: '41:08 remaining', room: 'South wall', time: '41:08' },
      { id: 6, state: 'finishing', status: 'Finishing soon', detail: '2:48 remaining', room: 'South wall', time: '2:48' }
    ];

    let selectedMachine = null;
    let selectedProgram = 'Normal';
    let selectedTemp = 'Warm';
    let selectedDuration = 35;
    let countdownSeconds = 0;
    let countdownInterval = null;
    let toastTimer = null;
    const main = document.getElementById('main');

    function machineCard(machine) {
      const clickable = machine.state === 'available' ? 'available' : machine.state;
      const icon = machine.state === 'available' ? icons.check : machine.state === 'finishing' ? icons.soon : icons.spin;
      const action = machine.state === 'available' ? `openSetup(${machine.id})` : 'showToast()';
      const badge = machine.state === 'available' ? 'READY' : machine.time;
      return `<button class="machine-card ${clickable}" onclick="${action}" aria-label="Machine ${machine.id}, ${machine.status}">
        <div class="machine-top"><div><div class="machine-label">Washer</div><div class="machine-number">${String(machine.id).padStart(2, '0')}</div></div><span class="status-badge">${badge}</span></div>
        <div class="machine-status"><div class="status-icon">${icon}</div><div><div class="status-name">${machine.status}</div><div class="status-detail">${machine.detail}</div></div></div>
        <div class="machine-bottom"><span>${icons.drum} Standard washer</span><span>${machine.room}</span></div>
      </button>`;
    }

    function renderHome() {
      main.innerHTML = `<section class="view">
        <div class="hero"><div><div class="eyebrow">Self-service station</div><h1>Choose a washer</h1><p class="subhead">Tap an available machine to set your wash cycle.</p></div>
          <div class="legend" aria-label="Status legend"><span class="legend-item"><i class="legend-dot" style="color:var(--green);background:var(--green)"></i>Available</span><span class="legend-item"><i class="legend-dot" style="color:var(--amber);background:var(--amber)"></i>Finishing soon</span><span class="legend-item"><i class="legend-dot" style="color:var(--red);background:var(--red)"></i>In use</span></div>
        </div>
        <div class="machine-grid">${machines.map(machineCard).join('')}</div>
      </section>`;
    }

    function renderSetup() {
      main.innerHTML = `<section class="view setup-wrap">
        <button class="back-button" onclick="renderHome()">${icons.back} Back to machines</button>
        <div class="setup-heading"><div class="selected-machine"><div class="machine-symbol">${icons.drum}</div><div><div class="eyebrow">Washer ${String(selectedMachine.id).padStart(2, '0')}</div><h1>Set your wash cycle</h1></div></div><div class="availability-pill"><i></i> Available now</div></div>
        <div class="control-section"><div class="section-heading"><h2>Wash program</h2><span>Choose a cycle</span></div><div class="program-grid">
          ${programCard('Quick', 'Everyday refresh', '20 min')} ${programCard('Normal', 'Cottons & mixed', '35 min')} ${programCard('Heavy', 'Towels & bedding', '55 min')}
        </div></div>
        <div class="control-section"><div class="section-heading"><h2>Water temperature</h2><span>Adjust for your fabric</span></div><div class="temp-grid">
          ${tempCard('Cold', '20°C', 'snow')} ${tempCard('Warm', '40°C', 'wave')} ${tempCard('Hot', '60°C', 'flame')}
        </div></div>
        <div class="control-section"><div class="section-heading"><h2>Cycle duration</h2><span>Set in 5-minute increments</span></div><div class="duration-panel"><div class="duration-readout"><strong id="duration-value">${selectedDuration}</strong><span>minutes</span></div><div class="duration-controls"><button class="stepper" onclick="adjustDuration(-5)" aria-label="Decrease duration">−</button><div class="range-wrap"><input id="duration-range" type="range" min="15" max="60" step="5" value="${selectedDuration}" oninput="setDuration(this.value)" aria-label="Cycle duration"><div class="range-labels"><span>15 min</span><span>60 min</span></div></div><button class="stepper" onclick="adjustDuration(5)" aria-label="Increase duration">+</button></div></div></div>
        <button class="start-button" onclick="startCycle()">${icons.play} Start washer ${String(selectedMachine.id).padStart(2, '0')}</button>
      </section>`;
      updateRangeFill();
    }

    function programCard(name, note, time) { return `<button class="option-card ${selectedProgram === name ? 'selected' : ''}" onclick="selectProgram('${name}')"><span class="option-title">${name}</span><span class="option-note">${note}</span><span class="option-time">${time}</span></button>`; }
    function tempCard(name, degrees, iconName) { return `<button class="temp-option ${selectedTemp === name ? 'selected' : ''}" onclick="selectTemp('${name}')"><span class="temp-icon temp-${name.toLowerCase()}">${icons[iconName]}</span><span><strong>${name}</strong><small>${degrees}</small></span></button>`; }

    function openSetup(id) { selectedMachine = machines.find(m => m.id === id); renderSetup(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function selectProgram(name) { selectedProgram = name; selectedDuration = name === 'Quick' ? 20 : name === 'Heavy' ? 55 : 35; renderSetup(); }
    function selectTemp(name) { selectedTemp = name; renderSetup(); }
    function setDuration(value) { selectedDuration = Number(value); document.getElementById('duration-value').textContent = selectedDuration; updateRangeFill(); }
    function adjustDuration(delta) { selectedDuration = Math.max(15, Math.min(60, selectedDuration + delta)); const range = document.getElementById('duration-range'); range.value = selectedDuration; setDuration(selectedDuration); }
    function updateRangeFill() { const range = document.getElementById('duration-range'); if (!range) return; const percent = ((selectedDuration - 15) / 45) * 100; range.style.background = `linear-gradient(90deg, #4aa8ff 0%, #4aa8ff ${percent}%, #47515e ${percent}%, #47515e 100%)`; }

    function startCycle() { countdownSeconds = selectedDuration * 60; renderConfirmation(); clearInterval(countdownInterval); countdownInterval = setInterval(() => { countdownSeconds = Math.max(0, countdownSeconds - 1); updateTimer(); if (!countdownSeconds) clearInterval(countdownInterval); }, 1000); }
    function formatTime(total) { const minutes = Math.floor(total / 60); const seconds = total % 60; return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`; }
    function renderConfirmation() { main.innerHTML = `<section class="view confirm-wrap"><button class="back-button" onclick="stopCycle(); renderHome()">${icons.back} Cancel and return</button><div class="cycle-chip">${icons.check} Cycle started</div><h1>Washer ${String(selectedMachine.id).padStart(2, '0')} is running</h1><p class="confirm-sub">${selectedProgram} wash · ${selectedTemp} temperature</p><div class="timer-shell" id="timer-shell" style="--progress: 100%"><div class="timer-inner"><strong id="timer-value">${formatTime(countdownSeconds)}</strong><span>time remaining</span></div></div><div class="finish-note">${icons.check} Your laundry will be ready when the timer ends.</div><button class="done-button" onclick="stopCycle(); renderHome()">Done</button></section>`; updateTimer(); }
    function updateTimer() { const timer = document.getElementById('timer-value'); const shell = document.getElementById('timer-shell'); if (!timer || !shell) return; timer.textContent = formatTime(countdownSeconds); const progress = Math.max(0, (countdownSeconds / (selectedDuration * 60)) * 100); shell.style.setProperty('--progress', `${progress}%`); }
    function stopCycle() { clearInterval(countdownInterval); countdownInterval = null; }
    function showToast() { const toast = document.getElementById('toast'); toast.classList.add('visible'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('visible'), 3000); }

    renderHome();
  </script>
</body>
</html>
